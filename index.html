let data=saved?original.map((p,i)=>({...p,checked:!!saved[i]}):original.map(p=>({...p}));
const list=document.getElementById("list"),search=document.getElementById("search"),status=document.getElementById("status"),type=document.getElementById("type");
[...new Set(data.flatMap(p=>[p.type1,p.type2]).filter(Boolean))].sort().forEach(t=>{let o=document.createElement("option");o.value=t;o.textContent=t;type.appendChild(o)});
function stats(){let d=data.filter(p=>p.checked).length,t=data.length,p=t?Math.round(d/t*100):0;document.getElementById("total").textContent=t;document.getElementById("done").textContent=d;document.getElementById("left").textContent=t-d;document.getElementById("pct").textContent=p+"%";document.getElementById("bar").style.width=p+"%"}
function save(){localStorage.setItem(key,JSON.stringify(data.map(p=>p.checked)));stats()}
function render(){
 let q=search.value.trim().toLowerCase(),s=status.value,t=type.value;
 let filtered=data.filter(p=>{let text=[p.num,p.id,p.name,p.type1,p.type2,p.type].join(" ").toLowerCase();return(!q||text.includes(q))&&(s==="all"||(s==="done"&&p.checked)||(s==="todo"&&!p.checked))&&(t==="all"||p.type1===t||p.type2===t)});
 list.innerHTML="";if(!filtered.length){list.innerHTML='<div class="empty">Geen Pokémon gevonden.</div>';stats();return}
 let frag=document.createDocumentFragment();filtered.forEach(p=>{
  let card=document.createElement("div");card.className="card";let cb=document.createElement("input");cb.type="checkbox";cb.className="check";cb.checked=p.checked;
  cb.onchange=()=>{p.checked=cb.checked;save();render()};
  let n=document.createElement("div");n.className="num";n.textContent="#"+String(p.num).padStart(4,"0");
  let info=document.createElement("div");info.style.flex="1";let name=document.createElement("div");name.className="name"+(p.checked?" done":"");name.textContent=p.name;
  let types=document.createElement("div");types.className="types";types.textContent=p.type;info.append(name,types);card.append(cb,n,info);frag.append(card)
 });list.append(frag);stats()
}
search.oninput=render;status.onchange=render;type.onchange=render;
document.getElementById("reset").onclick=()=>{if(confirm("Alle vinkjes wissen?")){data.forEach(p=>p.checked=false);save();render()}};
document.getElementById("top").onclick=()=>scrollTo({top:0,behavior:"smooth"});render();
</script></body></html>
